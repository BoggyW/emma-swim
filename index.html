<style>
:root{
  --bg:#f3f6f6; --surface:#ffffff; --surface2:#eef3f2; --ink:#14201f; --ink2:#4b5b59; --muted:#7c8a88;
  --line:#e0e7e6; --brand:#1a4c9c; --brand2:#002356; --brand-ink:#ffffff; --brand-soft:#e6eefa; --accent:#fdd26d;
  --good:#127a3a; --good-soft:#e5f4ea; --warn:#9a5b00; --warn-soft:#fdf1dc; --bad:#b42318;
  --lcm:#2a78d6; --scm:#d9622b; --grid:#e1e0d9; --axis:#c3c2b7; --gold:#a86f00; --gold-soft:#fbf1d6;
  --shadow:0 1px 2px rgba(16,40,38,.06),0 4px 14px rgba(16,40,38,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1514; --surface:#172120; --surface2:#1f2b2a; --ink:#e8efee; --ink2:#b3c1bf; --muted:#80908e;
  --line:#2a3634; --brand:#5b93ea; --brand2:#0b2a5c; --brand-soft:#16264a; --accent:#fdd26d;
  --good:#3ccf73; --good-soft:#163323; --warn:#f0a63a; --warn-soft:#3a2b12; --bad:#ff7a6e;
  --lcm:#3987e5; --scm:#d95926; --grid:#2c2c2a; --axis:#383835; --gold:#e9b949; --gold-soft:#3a3016;
  --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#0e1514; --surface:#172120; --surface2:#1f2b2a; --ink:#e8efee; --ink2:#b3c1bf; --muted:#80908e;
  --line:#2a3634; --brand:#5b93ea; --brand2:#0b2a5c; --brand-soft:#16264a; --accent:#fdd26d;
  --good:#3ccf73; --good-soft:#163323; --warn:#f0a63a; --warn-soft:#3a2b12; --bad:#ff7a6e;
  --lcm:#3987e5; --scm:#d95926; --grid:#2c2c2a; --axis:#383835; --gold:#e9b949; --gold-soft:#3a3016;
  --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header.top{background:var(--brand2);color:var(--brand-ink);padding:calc(10px + env(safe-area-inset-top)) 16px 12px;position:sticky;top:0;z-index:10}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.who{background:none;border:0;padding:4px 0;text-align:left;color:inherit}
.who b{display:block;white-space:nowrap;font-size:21px;letter-spacing:-.01em}
.who span{font-size:12px;opacity:.85}
.seg{display:flex;margin-top:10px;background:rgba(255,255,255,.18);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:none;color:#fff;padding:6px 12px;border-radius:8px;font-weight:600;font-size:13px}
.seg button.on{background:var(--accent);color:#002356}
.logo{height:72px;width:72px;display:block;flex:none;border-radius:15px;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.brandrow{display:flex;align-items:center;gap:10px;min-width:0}
.add-btn{width:40px!important;height:40px!important;border:0;background:var(--accent);color:#002356;width:36px;height:36px;border-radius:50%;font-size:24px;line-height:1;font-weight:500;flex:none}
main{padding:14px 16px}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:20px 4px 8px;font-weight:700}
h2.sec:first-child{margin-top:4px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.tile .v{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .l{font-size:11px;color:var(--muted);font-weight:600;line-height:1.25;margin-top:2px}
.note{background:var(--surface);border-radius:14px;padding:12px 14px;font-size:13px;color:var(--ink2);box-shadow:var(--shadow);margin-top:10px}
.note b{color:var(--ink)}
.list{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.item:first-child{border-top:0}
.item .main{flex:1;min-width:0}
.item .t1{font-weight:600;font-size:16px}
.item .t2{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .right{text-align:right;flex:none}
.time{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.time.dim{color:var(--muted);font-weight:500;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 7px;border-radius:999px;background:var(--surface2);color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.near{background:var(--warn-soft);color:var(--warn)}
.chip.pb{background:var(--gold-soft);color:var(--gold)}
.chip.c-lcm::before,.chip.c-scm::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--lcm)}
.chip.c-scm::before{background:var(--scm)}
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink2)}
.filters button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.meet-h{display:flex;justify-content:space-between;align-items:baseline;margin:18px 4px 6px;gap:8px}
.meet-h b{font-size:15px}
.meet-h span{font-size:12px;color:var(--muted);white-space:nowrap}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:560px}
nav.tabs button{border:0;background:none;padding:8px 0 10px;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--brand)}
.chart-card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:12px 8px 8px;position:relative}
.chart-card svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);padding:2px 8px 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.legend i.dash{width:16px;height:0;border-radius:0;border-top:2px dashed var(--ink2);vertical-align:3px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 8px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);display:none;z-index:2}
.tip b{font-size:14px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:0 0 calc(16px + env(safe-area-inset-bottom))}
.sheet-head{position:sticky;top:0;background:var(--brand2);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:18px 18px 0 0;z-index:1}
.sheet-head b{font-size:17px}
.sheet-head button{background:none;border:0;color:#fff;font-weight:600;font-size:16px;padding:4px}
.sheet-body{padding:14px 16px}
.form{background:var(--surface);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:14px}
.form label{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-top:1px solid var(--line);min-height:48px}
.form label:first-child{border-top:0}
.form label>span{color:var(--ink2);flex:none}
.form input,.form select{border:0;background:var(--surface2);border-radius:8px;padding:8px 10px;text-align:right;min-width:0;flex:1;max-width:62%;font-size:16px}
.form input[type=checkbox]{flex:none;width:22px;height:22px;accent-color:var(--brand)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font-weight:700;font-size:16px;background:var(--brand);color:#fff;margin-top:8px}
.btn.ghost{background:var(--surface);color:var(--brand);box-shadow:var(--shadow)}
.btn.danger{background:var(--surface);color:var(--bad);box-shadow:var(--shadow)}
.err{color:var(--bad);font-size:13px;margin:6px 4px}
.qt-table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.qt-table th,.qt-table td{padding:9px 8px;border-top:1px solid var(--line);text-align:right}
.qt-table th:first-child,.qt-table td:first-child{text-align:left}
.qt-table thead th{border-top:0;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.qt-table input{width:72px;border:0;background:var(--surface2);border-radius:6px;padding:5px 6px;text-align:right;font-size:14px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:60}
.gap-ok{color:var(--good);font-weight:600}
.gap-no{color:var(--ink2)}
.bigpb{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.bigpb .time{font-size:34px}
</style>
</head>

  return s>0 ? Math.round(s*100)/100 : null;
}
function fmt(t){
  if(t==null||!isFinite(t)) return '—';
  t=Math.round(t*100)/100;
  if(t<60) return t.toFixed(2);
  const m=Math.floor(t/60), s=t-m*60;
  return m+':'+s.toFixed(2).padStart(5,'0');
}
function fmtGap(g){ const a=Math.abs(g); return (g<0?'−':'+')+(a<60?a.toFixed(2):fmt(a)); }
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fdate(iso,short){ if(!iso) return ''; const [y,m,d]=iso.split('-').map(Number); return d+' '+MONTHS[m-1]+(short?'':' '+y); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function ageOn(dob,iso){ const [y1,m1,d1]=dob.split('-').map(Number),[y2,m2,d2]=iso.split('-').map(Number); let a=y2-y1; if(m2<m1||(m2===m1&&d2<d1)) a--; return a; }
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);

/* ---------- SCM -> LCM estimate (approx., per 50m; matches Swim Track's display for Free/IM/Breast) ---------- */
const CONV={Free:0.8,IM:0.8,Breast:1.0,Back:0.7,Fly:0.7};
const toLCM=(t,d,s)=>t+CONV[s]*(d/50);

/* ---------- State ---------- */
const KEY='emmaSwim.v2';
let DB, UI={tab:'bests',filter:'All',progEvent:'50 Free'};
function defaultStandards(){
  const nat={};
  (SEED.nationalStdSwimTrack||[]).forEach(s=>{ nat[ek(s.dist,s.stroke)]=fmt(s.time); });
  return {
    state:{name:'NSW State Age 2026/27',ageDate:'2026-12-15',from:'2025-10-01',course:'LCM',closes:'2026-12-01',table:STATE_2627_F},
    national:{name:'National',course:'LCM',from:'',times:nat}
  };
}
function load(){
  try{ const raw=localStorage.getItem(KEY); if(raw){ DB=JSON.parse(raw); } }catch(e){}
  if(!DB||!DB.swims){
    DB={swimmers:SEED.swimmers,meets:SEED.meets,swims:SEED.swims,standards:defaultStandards(),settings:{swimmer:'emma',course:'LCM'},importedFrom:'Swim Track backup 31 Oct 2026'};
    save(true);
  }
  // Emma only: clear any other swimmer saved on this device
  if(DB.swimmers.some(s=>s.id!=='emma')){
    DB.swimmers=DB.swimmers.filter(s=>s.id==='emma');
    DB.swims=DB.swims.filter(s=>s.swimmer==='emma');
    const used=new Set(DB.swims.map(s=>s.meet));
    DB.meets=DB.meets.filter(m=>used.has(m.id));
    DB.settings.swimmer='emma';
    save(true);
  }
}
function save(quiet){ try{ localStorage.setItem(KEY,JSON.stringify(DB)); }catch(e){ if(!quiet) toast('Could not save on this device'); } }

const swimmer=()=>DB.swimmers.find(s=>s.id===DB.settings.swimmer)||DB.swimmers[0];
const meetById=id=>DB.meets.find(m=>m.id===id);
const mySwims=()=>DB.swims.filter(s=>s.swimmer===DB.settings.swimmer);
const valid=s=>s.time!=null && !s.relay && !s.dq;

function stateQT(key){
  const st=DB.standards.state, sw=swimmer();
  const row=st.table[key]; if(!row) return null;
  const a=ageOn(sw.dob,st.ageDate);
  if(a<12) return null;
  const idx=a>=18?0:18-a;  // 17->1 ... 12->6
  return parseTime(row[idx]);
}
function natQT(key){ const t=DB.standards.national.times[key]; return t?parseTime(t):null; }

function bestOf(list){ let b=null; for(const s of list) if(valid(s)&&(!b||s.time<b.time)) b=s; return b; }
function eventSwims(key,course){ return mySwims().filter(s=>ek(s.dist,s.stroke)===key&&(!course||s.course===course)); }
function pbFor(key,course){ return bestOf(eventSwims(key,course)); }
function windowBest(key){ const st=DB.standards.state; return bestOf(eventSwims(key,st.course).filter(s=>s.date>=st.from)); }

/* PB flags: was this swim a PB (in its course) at the time it was swum */
function pbFlags(){
  const flags=new Set(), best={};
  [...mySwims()].filter(valid).sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id)).forEach(s=>{
    const k=s.course+ek(s.dist,s.stroke);
    if(best[k]==null||s.time<best[k]){ if(best[k]!=null) flags.add(s.id); best[k]=s.time; }
  });
  // first ever swim of an event is not a "PB" badge; current PBs always flagged
  EVENTS.forEach(([d,st])=>['LCM','SCM'].forEach(c=>{ const p=pbFor(ek(d,st),c); if(p) flags.add(p.id); }));
  return flags;
}

const $=s=>document.querySelector(s);
function render(){
  const sw=swimmer(), c=DB.settings.course;
  const ageNow=ageOn(sw.dob,todayISO());
  $('#who').innerHTML=`<b>${esc(sw.first)} ${esc(sw.last)}</b><span>Age ${ageNow}${DB.swimmers.length>1?' · switch ▾':''}</span>`;
  document.querySelectorAll('#courseSeg button').forEach(b=>b.classList.toggle('on',b.dataset.c===c));
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===UI.tab));
  $('#courseSeg').style.display=UI.tab==='more'?'none':'flex';
  const m=$('#main');
  ({bests:renderBests,swims:renderSwims,progress:renderProgress,more:renderMore})[UI.tab](m);
}

function qtChip(label,qt,t){
  if(!qt) return '';
  if(t==null) return `<span class="chip">${label} ${fmt(qt)}</span>`;
  const g=t-qt;
  if(g<=0) return `<span class="chip ok">✓ ${label} ${fmtGap(g)}</span>`;
  const near=g<=qt*0.02;
  return `<span class="chip ${near?'near':''}">${label} ${fmt(qt)} · ${fmtGap(g)}</span>`;
}

function renderBests(m){
  const c=DB.settings.course, st=DB.standards.state, sw=swimmer();
  const stAge=ageOn(sw.dob,st.ageDate);
  const rows=[]; let nState=0,nNat=0,nStateEv=0,nNatEv=0,recent=0;
  const cutoff=new Date(Date.now()-365*864e5).toISOString().slice(0,10);
  EVENTS.forEach(([d,s])=>{
    const key=ek(d,s); const pb=pbFor(key,c);
    const sq=c===st.course?stateQT(key):null, nq=c==='LCM'?natQT(key):null;
    const wb=c===st.course?windowBest(key):null;
    if(sq){ nStateEv++; if(wb&&wb.time<=sq) nState++; }
    if(nq){ nNatEv++; if(pb&&pb.time<=nq) nNat++; }
    if(pb&&pb.date>=cutoff) recent++;
    if(!pb && !sq) return;
    rows.push({key,pb,sq,nq,wb});
  });
  let h=`<div class="tiles">
    <div class="tile"><div class="v">${c==='LCM'?nState+'<span style="font-size:15px;color:var(--muted)">/'+nStateEv+'</span>':'—'}</div><div class="l">State QTs<br>${c==='LCM'?'('+stAge+'yrs)':'LCM only'}</div></div>
    <div class="tile"><div class="v">${c==='LCM'?nNat+'<span style="font-size:15px;color:var(--muted)">/'+nNatEv+'</span>':'—'}</div><div class="l">National<br>times</div></div>
    <div class="tile"><div class="v">${recent}</div><div class="l">PBs set in<br>last 12 months</div></div>
  </div>`;
  if(c==='LCM'){
    const days=Math.ceil((new Date(st.closes)-new Date(todayISO()))/864e5);
    h+=`<div class="note"><b>${esc(st.name)}</b> · age ${stAge} as at ${fdate(st.ageDate)}. Only LCM swims since ${fdate(st.from)} count.${days>0?` Entries close ${fdate(st.closes)} (<b>${days} days</b>).`:''}</div>`;
  } else {
    h+=`<div class="note">Short course PBs. State & National qualifying is long course only — grey figures show an <b>estimated LCM equivalent</b>.</div>`;
  }
  h+=`<h2 class="sec">${c==='LCM'?'Long course':'Short course'} personal bests</h2><div class="list">`;
  rows.forEach(r=>{
    const [d,s]=r.key.split(' '), mt=r.pb&&meetById(r.pb.meet);
    let chips='';
    if(c==='LCM'){
      chips+=qtChip('State',r.sq,r.wb?r.wb.time:null);
      chips+=qtChip('Nat',r.nq,r.pb?r.pb.time:null);
      if(r.sq&&r.pb&&r.wb&&r.wb.id!==r.pb.id) chips+=`<span class="chip">Since ${fdate(st.from,true).replace(/ \d+$/,'')}: ${fmt(r.wb.time)}</span>`;
      if(r.sq&&r.pb&&!r.wb) chips+=`<span class="chip near">No swim in QT window</span>`;
    }
    h+=`<button class="item" data-ev="${r.key}"><div class="main"><div class="t1">${r.key}</div>
      <div class="t2">${r.pb?fdate(r.pb.date)+(mt?' · '+esc(mt.name):''):'Not swum yet'}</div>
      ${chips?`<div class="chips">${chips}</div>`:''}</div>
      <div class="right">${r.pb?`<div class="time">${fmt(r.pb.time)}</div>`:'<div class="time dim">—</div>'}
      ${c==='SCM'&&r.pb?`<div class="time dim">≈ ${fmt(toLCM(r.pb.time,+d,s))}</div>`:''}</div></button>`;
  });
  h+='</div>';
  m.innerHTML=h;
  m.querySelectorAll('[data-ev]').forEach(b=>b.onclick=()=>{UI.progEvent=b.dataset.ev;UI.tab='progress';render();scrollTo(0,0);});
}

function renderSwims(m){
  const c=DB.settings.course, flags=pbFlags();
  const evs=[...new Set(mySwims().filter(s=>s.course===c).map(s=>ek(s.dist,s.stroke)))];
  const ordered=EVENTS.map(e=>ek(...e)).filter(k=>evs.includes(k));
  let list=mySwims().filter(s=>s.course===c&&(UI.filter==='All'||ek(s.dist,s.stroke)===UI.filter));
  list.sort((a,b)=>b.date.localeCompare(a.date)||(a.event||0)-(b.event||0));
  let h=`<div class="filters">${['All',...ordered].map(k=>`<button class="${UI.filter===k?'on':''}" data-f="${k}">${k}</button>`).join('')}</div>`;
  if(!list.length) h+=`<div class="empty">No ${c} swims yet.</div>`;
  let lastMeet=null, open=false;
  list.forEach(s=>{
    const mt=meetById(s.meet), mk=s.meet+'|'+(UI.filter==='All'?'':s.date);
    if(mk!==lastMeet){
      if(open) h+='</div>';
      const ds=list.filter(x=>x.meet===s.meet).map(x=>x.date).sort();
      h+=`<div class="meet-h"><b>${esc(mt?mt.name:'No meet')}</b><span>${UI.filter==='All'?(ds[0]===ds[ds.length-1]?fdate(ds[0]):fdate(ds[0],true)+' – '+fdate(ds[ds.length-1])):fdate(s.date)}${mt&&mt.location?' · '+esc(mt.location):''}</span></div><div class="list">`;
      lastMeet=mk; open=true;
    }
    const extras=[s.place?ordinal(s.place):'',s.event?'Ev '+s.event:'',s.relay?'Relay':'',s.dq?'DQ':''].filter(Boolean).join(' · ');
    h+=`<button class="item" data-id="${s.id}"><div class="main"><div class="t1">${ek(s.dist,s.stroke)}</div><div class="t2">${fdate(s.date)}${extras?' · '+extras:''}</div></div>
      <div class="right">${flags.has(s.id)?'<span class="chip pb">PB</span> ':''}</div>
      <div class="right">${s.time!=null?`<div class="time">${fmt(s.time)}</div>`:'<div class="time dim">add time</div>'}</div></button>`;
  });
  if(open) h+='</div>';
  m.innerHTML=h;
  m.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{UI.filter=b.dataset.f;render();});
  m.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openSwim(DB.swims.find(s=>s.id===b.dataset.id)));
}
const ordinal=n=>n+(['th','st','nd','rd'][(n%100-20)%10]||['th','st','nd','rd'][n%100]||'th');

function renderProgress(m){
  const key=UI.progEvent, c=DB.settings.course;
  const have=new Set(mySwims().filter(valid).map(s=>ek(s.dist,s.stroke)));
  const opts=EVENTS.map(e=>ek(...e)).filter(k=>have.has(k));
  if(!have.has(key)&&opts.length) UI.progEvent=opts[0];
  const k=UI.progEvent;
  const all=eventSwims(k).filter(valid).sort((a,b)=>a.date.localeCompare(b.date));

    <div class="tile"><div class="l">SCM PB</div><div class="v">${pbS?fmt(pbS.time):'—'}</div><div class="l">${pbS?fdate(pbS.date):''}</div></div></div>`;
  if(sq||nq){

    if(nq){ const t=pbL&&pbL.time; h+=`<b>National ${fmt(nq)}</b> — ${t==null?'no LCM time yet':t<=nq?`<span class="gap-ok">achieved, ${fmtGap(t-nq)}</span>`:`<span class="gap-no">${fmtGap(t-nq)} to go</span>`}`; }
    h+=`</div>`;
  }
  h+=`<h2 class="sec">Times over time</h2><div class="chart-card" id="chart"><div class="tip" id="tip"></div></div>`;

    h+=`<button class="item" data-id="${s.id}"><div class="main"><div class="t1" style="font-size:15px">${esc(mt?mt.name:'')}</div><div class="t2">${fdate(s.date)}${s.place?' · '+ordinal(s.place):''}</div></div>
    <div class="right"><span class="chip c-${s.course.toLowerCase()}">${s.course}</span>${flags.has(s.id)?' <span class="chip pb">PB</span>':''}</div>

  h+='</div>';
  m.innerHTML=h;
  m.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{UI.progEvent=b.dataset.e;render();});
  m.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openSwim(DB.swims.find(s=>s.id===b.dataset.id)));
  drawChart($('#chart'),all,sq,nq);
}

function drawChart(el,swims,sq,nq){
  const W=340,H=230,L=44,R=40,T=14,B=26;
  if(!swims.length){ el.insertAdjacentHTML('beforeend','<div class="empty">No times yet</div>'); return; }
  const ts=swims.map(s=>+new Date(s.date));
  let x0=Math.min(...ts), x1=Math.max(...ts); if(x1-x0<30*864e5){x0-=20*864e5;x1+=20*864e5;}
  const vals=swims.map(s=>s.time).concat([sq,nq].filter(Boolean));
  let y0=Math.min(...vals), y1=Math.max(...vals); const pad=(y1-y0)*0.08||1; y0-=pad; y1+=pad;
  const X=t=>L+(t-x0)/(x1-x0)*(W-L-R), Y=v=>T+(v-y0)/(y1-y0)*(H-T-B); // faster (lower) at top
  const css=getComputedStyle(document.documentElement), col=n=>css.getPropertyValue(n).trim();
  let g='';
  // y grid
  const step=niceStep((y1-y0)/4);
  for(let v=Math.ceil(y0/step)*step; v<=y1; v+=step){ g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="${col('--grid')}" stroke-width="1"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="${col('--muted')}">${fmt(v)}</text>`; }
  // x ticks: years
  const ya=new Date(x0).getFullYear(), yb=new Date(x1).getFullYear();
  for(let y=ya;y<=yb+1;y++){ const t=+new Date(y+'-01-01'); if(t<x0||t>x1) continue; g+=`<line x1="${X(t)}" x2="${X(t)}" y1="${T}" y2="${H-B}" stroke="${col('--grid')}"/><text x="${X(t)}" y="${H-B+16}" text-anchor="middle" font-size="11" fill="${col('--muted')}">${y}</text>`; }
  g+=`<line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="${col('--axis')}"/>`;
  g+=`<text x="${L-6}" y="${T-2}" text-anchor="end" font-size="11" fill="${col('--muted')}">faster ↑</text>`;
  // QT lines
  [[sq,'State'],[nq,'Nat']].forEach(([q,lab])=>{ if(!q) return; g+=`<line x1="${L}" x2="${W-R}" y1="${Y(q)}" y2="${Y(q)}" stroke="${col('--ink2')}" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W-R+4}" y="${Y(q)+4}" font-size="11" font-weight="600" fill="${col('--ink2')}">${lab}</text>`; });
  // series
  const pts=[];
  ['LCM','SCM'].forEach(c=>{
    const ss=swims.filter(s=>s.course===c); if(!ss.length) return;
    const color=col(c==='LCM'?'--lcm':'--scm');
    // best-so-far step line
    let best=Infinity, d='';
    ss.forEach((s,i)=>{ best=Math.min(best,s.time); d+=(i?'L':'M')+X(+new Date(s.date))+','+Y(best)+' '; });
    g+=`<path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" opacity=".9"/>`;
    ss.forEach(s=>{ const px=X(+new Date(s.date)),py=Y(s.time); pts.push({px,py,s,color});
      g+=`<circle cx="${px}" cy="${py}" r="4" fill="${color}" stroke="${col('--surface')}" stroke-width="2"/>`; });
    const last=ss[ss.length-1];
  });
  const svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Times over time">${g}<rect id="hit" x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent"/><circle id="hl" r="7" fill="none" stroke-width="2" style="display:none"/></svg>`;
  el.insertAdjacentHTML('beforeend',svg+`<div class="legend"><span><i style="background:var(--lcm)"></i>LCM</span><span><i style="background:var(--scm)"></i>SCM</span><span style="color:var(--muted)">Dots = each swim · line = best so far</span>${sq||nq?'<span><i class="dash"></i>Qualifying time</span>':''}</div>`);
  const svgEl=el.querySelector('svg'), tip=el.querySelector('#tip'), hl=el.querySelector('#hl');
  function show(ev){
    const r=svgEl.getBoundingClientRect(), sx=(ev.clientX-r.left)*W/r.width, sy=(ev.clientY-r.top)*H/r.height;
    let best=null,bd=1e9; pts.forEach(p=>{ const d=Math.hypot(p.px-sx,(p.py-sy)*0.6); if(d<bd){bd=d;best=p;} });
    if(!best||bd>60){hide();return;}
    const mt=meetById(best.s.meet);
    hl.setAttribute('cx',best.px);hl.setAttribute('cy',best.py);hl.setAttribute('stroke',best.color);hl.style.display='';
    tip.innerHTML=`<b>${fmt(best.s.time)}</b> ${best.s.course}<br>${fdate(best.s.date)}${mt?' · '+esc(mt.name):''}`;
    tip.style.display='block'; tip.style.left=(best.px*r.width/W+8)+'px'; tip.style.top=(best.py*r.height/H+12)+'px';
    const tw=tip.offsetWidth, cw=el.clientWidth, cx=best.px*r.width/W+8;
    tip.style.left=Math.min(Math.max(cx,tw/2+4),cw-tw/2-4)+'px';
  }
  function hide(){tip.style.display='none';hl.style.display='none';}
  svgEl.addEventListener('pointermove',show); svgEl.addEventListener('pointerdown',show); svgEl.addEventListener('pointerleave',hide);
}
function niceStep(x){ const p=Math.pow(10,Math.floor(Math.log10(x))), f=x/p; return (f<1.5?1:f<3?2:f<7?5:10)*p; }

function renderMore(m){
  const st=DB.standards.state, nat=DB.standards.national, sw=swimmer();
  const a=ageOn(sw.dob,st.ageDate);
  let h=`<h2 class="sec">Qualifying times · ${esc(sw.first)}</h2>
  <div class="note">State: <b>${esc(st.name)}</b>, female ${a>=18?'18 & over':a+' yrs'} (age at ${fdate(st.ageDate)}). National times are editable — tap a value to change it.</div>
  <div class="list" style="margin-top:10px;padding:2px 6px"><table class="qt-table"><thead><tr><th>Event</th><th>State</th><th>National</th><th>LCM PB</th></tr></thead><tbody>`;
  EVENTS.forEach(([d,s])=>{ const k=ek(d,s), sq=stateQT(k), pb=pbFor(k,'LCM');
    if(!sq && !nat.times[k] && !pb) return;
    h+=`<tr><td>${k}</td><td>${sq?fmt(sq):'—'}</td><td><input data-nat="${k}" value="${esc(nat.times[k]||'')}" placeholder="—" inputmode="decimal"></td><td>${pb?fmt(pb.time):'—'}</td></tr>`; });
  h+=`</tbody></table></div>
  <h2 class="sec">Backup</h2>
  <div class="note">Swims are saved on <b>this device's browser</b>. Export a backup after each meet and keep it in iCloud/Files — you can restore it here or on another phone.</div>
  <button class="btn" id="exp">Export backup file</button>
  <button class="btn ghost" id="imp">Restore from backup file</button>
  <input type="file" id="impFile" accept=".json,application/json" hidden>
  <h2 class="sec">Swimmers</h2><div class="list">${DB.swimmers.map(s=>`<button class="item" data-sw="${s.id}"><div class="main"><div class="t1">${esc(s.first)} ${esc(s.last)}</div><div class="t2">Born ${fdate(s.dob)} · ${DB.swims.filter(x=>x.swimmer===s.id).length} swims</div></div><div class="right">${s.id===DB.settings.swimmer?'<span class="chip ok">Selected</span>':''}</div></button>`).join('')}</div>
  <h2 class="sec">Appearance</h2><div class="list">${['auto','light','dark'].map(t=>`<button class="item" data-theme="${t}"><div class="main"><div class="t1">${t==='auto'?'Match phone':t[0].toUpperCase()+t.slice(1)}</div></div><div class="right">${(DB.settings.theme||'auto')===t?'✓':''}</div></button>`).join('')}</div>
  <h2 class="sec">Data</h2>
  <div class="note">${DB.swims.length} swims across ${DB.meets.length} meets. ${esc(DB.importedFrom||'')}</div>
  <button class="btn danger" id="reset">Reset to original Swim Track data</button>`;
  m.innerHTML=h;
  m.querySelectorAll('[data-nat]').forEach(inp=>inp.onchange=()=>{ const v=inp.value.trim(); if(v&&!parseTime(v)){toast('Not a valid time');return;} if(v) DB.standards.national.times[inp.dataset.nat]=fmt(parseTime(v)); else delete DB.standards.national.times[inp.dataset.nat]; save(); toast('National time saved'); });
  m.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>{DB.settings.swimmer=b.dataset.sw;save();render();});
  m.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{DB.settings.theme=b.dataset.theme;save();applyTheme();render();});
  $('#exp').onclick=exportBackup;
  $('#imp').onclick=()=>$('#impFile').click();
  $('#impFile').onchange=e=>importBackup(e.target.files[0]);
  $('#reset').onclick=()=>{ if(confirm('Replace everything on this device with the original Swim Track data? Swims added since will be lost unless exported.')){ localStorage.removeItem(KEY); DB=null; load(); render(); toast('Reset done'); } };
}

function exportBackup(){
  const blob=new Blob([JSON.stringify({app:'emma-swim',version:2,exported:new Date().toISOString(),data:DB},null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='emma-swim-backup-'+todayISO()+'.json'; document.body.appendChild(a); a.click(); a.remove();
  DB.settings.lastBackup=todayISO(); save();
}
function importBackup(file){
  if(!file) return; const r=new FileReader();
  r.onload=()=>{ try{ const j=JSON.parse(r.result); const d=j.data||j; if(!d.swims||!d.meets) throw 0;
      if(!confirm(`Restore ${d.swims.length} swims from this backup? This replaces the data on this device.`)) return;
      DB=d; save(); render(); toast('Backup restored'); }catch(e){ toast('That file is not an Emma Swim backup'); } };
  r.readAsText(file);
}

/* ---------- Add / edit swim ---------- */
function openSwim(s){
  const isNew=!s;
  const recentMeets=[...DB.meets].map(mt=>({mt,last:DB.swims.filter(x=>x.meet===mt.id).map(x=>x.date).sort().pop()||''})).sort((a,b)=>b.last.localeCompare(a.last));
  const lastSwim=[...mySwims()].sort((a,b)=>b.date.localeCompare(a.date))[0];
  s=s||{id:'n'+uid(),swimmer:DB.settings.swimmer,date:todayISO(),dist:50,stroke:'Free',time:null,meet:lastSwim&&lastSwim.date>=new Date(Date.now()-4*864e5).toISOString().slice(0,10)?lastSwim.meet:'',course:DB.settings.course};
  const bg=document.createElement('div'); bg.className='sheet-bg';
  bg.innerHTML=`<div class="sheet"><div class="sheet-head"><button data-x>Cancel</button><b>${isNew?'Add swim':'Edit swim'}</b><button data-save>Save</button></div><div class="sheet-body">
    <div class="form">
      <label><span>Meet</span><select id="fMeet"><option value="">— choose —</option><option value="__new">+ New meet…</option>${recentMeets.map(({mt})=>`<option value="${mt.id}" ${mt.id===s.meet?'selected':''}>${esc(mt.name)} (${mt.course})</option>`).join('')}</select></label>
      <div id="newMeet" hidden>
        <label><span>Meet name</span><input id="fMName" placeholder="e.g. Sydney Metro Summer"></label>
        <label><span>Location</span><input id="fMLoc" placeholder="e.g. SOPAC"></label>
        <label><span>Course</span><select id="fMCourse"><option>LCM</option><option>SCM</option></select></label>
      </div>
      <label><span>Date</span><input type="date" id="fDate" value="${s.date}"></label>
    </div>
    <div class="form">
      <label><span>Stroke</span><select id="fStroke">${STROKES.map(x=>`<option ${x===s.stroke?'selected':''}>${x}</option>`).join('')}</select></label>
      <label><span>Distance</span><select id="fDist">${[50,100,200,400,800,1500].map(x=>`<option ${x===s.dist?'selected':''}>${x}</option>`).join('')}</select></label>
      <label><span>Time</span><input id="fTime" inputmode="decimal" placeholder="28.26 or 1:01.08" value="${s.time!=null?fmt(s.time):''}"></label>
    </div>
    <div id="fHint" class="note" style="margin:-4px 0 14px"></div>
    <div class="form">
      <label><span>Place</span><input id="fPlace" inputmode="numeric" value="${s.place||''}"></label>
      <label><span>Event #</span><input id="fEvent" inputmode="numeric" value="${s.event||''}"></label>
      <label><span>Heat</span><input id="fHeat" inputmode="numeric" value="${s.heat||''}"></label>
      <label><span>Lane</span><input id="fLane" inputmode="numeric" value="${s.lane||''}"></label>
      <label><span>Relay lead-off</span><input type="checkbox" id="fRelay" ${s.relay?'checked':''}></label>
      <label><span>Disqualified</span><input type="checkbox" id="fDq" ${s.dq?'checked':''}></label>
    </div>
    <div class="err" id="fErr"></div>
    ${isNew?'':'<button class="btn danger" data-del>Delete swim</button>'}
  </div></div>`;
  document.body.appendChild(bg);
  const q=id=>bg.querySelector(id);
  const close=()=>bg.remove();
  bg.onclick=e=>{ if(e.target===bg) close(); };
  q('[data-x]').onclick=close;
  q('#fMeet').onchange=()=>{ q('#newMeet').hidden=q('#fMeet').value!=='__new'; hint(); };
  function curCourse(){ const v=q('#fMeet').value; if(v==='__new') return q('#fMCourse').value; const mt=meetById(v); return mt?mt.course:DB.settings.course; }
  function hint(){
    const t=parseTime(q('#fTime').value), key=ek(+q('#fDist').value,q('#fStroke').value), c=curCourse();
    const pb=bestOf(eventSwims(key,c).filter(x=>x.id!==s.id)); let out=[];
    if(pb) out.push(`${c} PB ${fmt(pb.time)}`);
    if(t&&pb&&t<pb.time) out.push(`<span class="gap-ok">New PB by ${(pb.time-t).toFixed(2)}s 🎉</span>`);
    if(t&&!pb) out.push('First '+c+' swim of this event');
    const sq=c==='LCM'?stateQT(key):null;
    if(t&&sq) out.push(t<=sq?`<span class="gap-ok">State QT ✓ (${fmt(sq)})</span>`:`State QT ${fmt(sq)} (${fmtGap(t-sq)})`);
    q('#fHint').innerHTML=out.join(' · ')||'Enter the time to compare with PB';
  }
  ['#fTime','#fDist','#fStroke','#fMCourse'].forEach(id=>q(id).addEventListener('input',hint)); hint();
  if(!isNew) q('[data-del]').onclick=()=>{ if(confirm('Delete this swim?')){ DB.swims=DB.swims.filter(x=>x.id!==s.id); save(); close(); render(); toast('Swim deleted'); } };
  q('[data-save]').onclick=()=>{
    let meetId=q('#fMeet').value;
    if(meetId==='__new'){ const n=q('#fMName').value.trim(); if(!n){q('#fErr').textContent='Give the new meet a name';return;}
      meetId='m'+uid(); DB.meets.push({id:meetId,name:n,location:q('#fMLoc').value.trim(),course:q('#fMCourse').value}); }
    if(!meetId){ q('#fErr').textContent='Choose a meet (course comes from the meet)'; return; }
    const tv=q('#fTime').value.trim(), t=parseTime(tv);
    if(tv&&!t){ q('#fErr').textContent='Time should look like 28.26 or 1:01.08'; return; }
    const mt=meetById(meetId);
    const rec=Object.assign(s,{date:q('#fDate').value||todayISO(),dist:+q('#fDist').value,stroke:q('#fStroke').value,time:t,meet:meetId,course:mt.course});
    ['place','event','heat','lane'].forEach(f=>{ const v=parseInt(q('#f'+f[0].toUpperCase()+f.slice(1)).value); if(v>0) rec[f]=v; else delete rec[f]; });
    if(q('#fRelay').checked) rec.relay=true; else delete rec.relay;
    if(q('#fDq').checked) rec.dq=true; else delete rec.dq;
    if(isNew) DB.swims.push(rec);
    if(DB.settings.course!==rec.course) DB.settings.course=rec.course;
    save(); close(); render(); toast(isNew?'Swim added':'Swim updated');
  };
}

function openSwimmerPicker(){
  if(DB.swimmers.length<2) return;
  const i=DB.swimmers.findIndex(s=>s.id===DB.settings.swimmer);
  DB.settings.swimmer=DB.swimmers[(i+1)%DB.swimmers.length].id; save(); render();
}
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2000); }
function applyTheme(){ const t=DB.settings.theme||'auto'; if(t==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',t); }

/* ---------- Wire up ---------- */
load(); applyTheme();
document.querySelectorAll('#courseSeg button').forEach(b=>b.onclick=()=>{DB.settings.course=b.dataset.c;UI.filter='All';save();render();});
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{UI.tab=b.dataset.tab;render();scrollTo(0,0);});
$('#addBtn').onclick=()=>openSwim(null);
$('#who').onclick=openSwimmerPicker;
render();
</script>
